name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.0
  NODE_VERSION: 26.5.1

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.31.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm buf:format:check
      - run: pnpm buf:lint
      - run: pnpm buf:generate
      - run: sqlc generate
      - run: git diff --exit-code -- gen internal/database/dbsql

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: go.sum
      - run: go mod download
      - run: test -z "$(gofmt -l $(find . -type f -name '*.go'))"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aether/web lint
      - run: pnpm --filter @aether/web typecheck
      - run: pnpm --filter @aether/web test
      - run: pnpm --filter @aether/web build

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: aether_test
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether -d aether_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AETHER_TEST_DATABASE_URL: postgres://aether:aether@localhost:5432/aether_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: go.sum
      - run: go test -race -count=1 ./tests/integration/...

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aether/web exec playwright install --with-deps chromium
      - run: pnpm --filter @aether/web build
      - run: pnpm --filter @aether/web test:e2e

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.controlplane
          push: false
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: false
