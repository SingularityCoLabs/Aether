name: aether

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  controlplane:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.controlplane
      args:
        VERSION: dev
        COMMIT: local
        BUILD_DATE: compose
    environment:
      AETHER_ENVIRONMENT: ${AETHER_ENVIRONMENT:-development}
      AETHER_HTTP_ADDRESS: ${AETHER_HTTP_ADDRESS:-:8080}
      AETHER_DATABASE_URL: postgres://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether}@postgres:5432/${POSTGRES_DB:-aether}?sslmode=disable
      AETHER_DATABASE_REQUIRED: ${AETHER_DATABASE_REQUIRED:-true}
      AETHER_LOG_LEVEL: ${AETHER_LOG_LEVEL:-debug}
      AETHER_ALLOWED_ORIGINS: ${AETHER_ALLOWED_ORIGINS:-http://localhost:3000}
      AETHER_SHUTDOWN_TIMEOUT: ${AETHER_SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/aetherd",
          "healthcheck",
          "--url",
          "http://localhost:8080/readyz",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_AETHER_API_URL: ${NEXT_PUBLIC_AETHER_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      controlplane:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
