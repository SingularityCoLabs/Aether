syntax = "proto3";

package aether.v1;

import "aether/v1/common.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/SingularityCoLabs/aether/gen/go/aether/v1;aetherv1";

message Resource {
  string id = 1;
  string project_id = 2;
  string kind = 3;
  string name = 4;
  google.protobuf.Struct spec = 5;
  google.protobuf.Struct status = 6;
  int64 generation = 7;
  int64 observed_generation = 8;
  string provider = 9;
  repeated StatusCondition conditions = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}
