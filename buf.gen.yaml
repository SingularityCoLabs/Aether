version: v2
clean: true
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: gen/go
    opt:
      - paths=source_relative
  - local:
      - go
      - run
      - connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: gen/ts/src
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: api/proto
